<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2a1025"/>
      <stop offset="100%" style="stop-color:#7a2060"/>
    </linearGradient>
    <linearGradient id="circle-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c0392b;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:0.1"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <!-- Decorative elements -->
  <circle cx="350" cy="50" r="80" fill="#c0392b" opacity="0.05"/>
  <circle cx="50" cy="350" r="60" fill="#c0392b" opacity="0.05"/>
  <!-- Main circle -->
  <circle cx="200" cy="160" r="70" fill="url(#circle-fill)" stroke="#c0392b" stroke-width="2" opacity="0.8"/>
  <!-- Emoji icon -->
  <text x="200" y="180" text-anchor="middle" font-size="50">🧸</text>
  <!-- Label -->
  <rect x="0" y="320" width="400" height="80" fill="rgba(0,0,0,0.4)"/>
  <text x="200" y="355" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#ffffff" font-weight="600">Plush Toy</text>
  <text x="200" y="378" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#999">ArcaneVault Collection</text>
</svg>